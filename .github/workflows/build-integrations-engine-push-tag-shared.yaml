name: Build Weni Integrations Engine in Shared (Push Tag)

on:
  push:
    tags:
      - '*.*.*-develop'
      - '*.*.*-staging'
      - '*.*.*'

jobs:
  call-workflow:
    uses: weni-ai/actions-workflows/.github/workflows/reusable-workflow.yaml@main
    with:
      image_repository: integrations
      image_tag_prefix: engine-
      dockerfile: "docker/Dockerfile"
      target_repository: weni-ai/kubernetes-manifests-platform
      target_repository_branch: main
      target_application: integrations-engine
      target_patch_file: deployment-engine.json
    secrets: inherit
